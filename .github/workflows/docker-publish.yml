name: Build and Push Docker Image

on:
  push:
    # master 推送即自动构建（滚动 latest），无需再手动打 tag。
    branches:
      - master
    # 发布 tag 依旧构建（GitHub 的 paths 筛选只对分支推送生效，
    # 不会限制 tag 推送，所以打 tag 一定会触发）。
    tags:
      - "v*"
    paths:
      - "src/**"
      - "open-sse/**"
      - "public/**"
      - "custom-server.js"
      - "package*.json"
      - "next.config.*"
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

# 同一 ref 上重复触发时取消上一次未完成的构建，避免 master 连续推送时排队。
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 镜像名来源优先级：
      #   1) Repository Variables 里的 GHCR_IMAGE / DOCKERHUB_IMAGE（Settings -> Secrets and variables -> Actions -> Variables）
      #   2) 若未配置，则回退到自动计算（GHCR 用当前仓库名并强制小写，Docker Hub 用 secrets.DOCKERHUB_USERNAME）
      # 注意：Docker/OCI 要求镜像仓库名必须全小写，这里对所有回退值统一做小写处理。
      - name: Resolve image names
        id: img
        env:
          VAR_GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
          VAR_DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          repo_lower="${GITHUB_REPOSITORY,,}"

          ghcr_image="${VAR_GHCR_IMAGE:-ghcr.io/${repo_lower}}"
          if [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            dockerhub_image="${VAR_DOCKERHUB_IMAGE:-docker.io/${DOCKERHUB_USERNAME}/9router}"
          else
            dockerhub_image="${VAR_DOCKERHUB_IMAGE:-}"
          fi

          echo "GHCR_IMAGE=${ghcr_image,,}" >> "$GITHUB_OUTPUT"
          echo "DOCKERHUB_IMAGE=${dockerhub_image,,}" >> "$GITHUB_OUTPUT"

          echo "Resolved GHCR_IMAGE=${ghcr_image,,}"
          echo "Resolved DOCKERHUB_IMAGE=${dockerhub_image,,}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ steps.img.outputs.DOCKERHUB_IMAGE != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.img.outputs.GHCR_IMAGE }}
            ${{ steps.img.outputs.DOCKERHUB_IMAGE }}
          tags: |
            # tag 推送（v*）→ 版本号标签；master 推送 → 滚动 latest（二者都会更新 latest）
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.img.outputs.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
